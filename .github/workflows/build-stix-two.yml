# .github/workflows/build-stix-two.yml
name: Build STIX Two Fonts (tirobuild)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ttfautohint

      - name: Install Python dependencies and fix setuptools
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt
          # 修复 pkg_resources
          pip uninstall -y setuptools || true
          pip install --no-cache-dir setuptools==70.0.0
          python -c "import pkg_resources; print('pkg_resources OK')"
          pip install --force-reinstall --no-deps fs
          python -c "import fs; print('fs OK')"
          python -c "import ufo2ft; print('ufo2ft OK')"

      - name: Build fonts with tirobuild.py
        run: python tools/tirobuild.py STIXbuild.yml

      - name: Organize artifacts by category
        run: |
          mkdir -p package/static-ttf \
                   package/static-otf \
                   package/variable-ttf \
                   package/variable-otf \
                   package/web \
                   package/other

          find output -type f \( -name "*.ttf" -o -name "*.otf" -o -name "*.woff" -o -name "*.woff2" \) | while read file; do
            if [[ "$file" =~ \.woff2?$ ]]; then
              category="web"
            elif [[ "$file" =~ /TTFVF/ ]]; then
              category="variable-ttf"
            elif [[ "$file" =~ /OTFVF/ ]]; then
              category="variable-otf"
            elif [[ "$file" =~ /TTF/ ]]; then
              category="static-ttf"
            elif [[ "$file" =~ /OTF/ ]]; then
              category="static-otf"
            else
              category="other"
            fi
            cp "$file" "package/$category/"
          done

      - name: Upload static TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-ttf
          path: package/static-ttf
          if-no-files-found: ignore

      - name: Upload static OTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-otf
          path: package/static-otf
          if-no-files-found: ignore

      - name: Upload variable TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-ttf
          path: package/variable-ttf
          if-no-files-found: ignore

      - name: Upload variable OTF (CFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-otf
          path: package/variable-otf
          if-no-files-found: ignore

      - name: Upload web fonts (WOFF/WOFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-web-fonts
          path: package/web
          if-no-files-found: ignore

      - name: Upload other (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-other
          path: package/other
          if-no-files-found: ignore