# .github/workflows/build-stix-two.yml
name: Build STIX Two Fonts (using tirobuild.py)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 禁用 pip 缓存，避免干扰
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget \
            ttfautohint

      - name: Clean pip cache and install base packages
        run: |
          pip cache purge
          pip install --upgrade pip wheel
          pip install --force-reinstall --no-cache-dir setuptools

      - name: Install project dependencies
        run: |
          # 先安装 requirements.txt（可能包含旧版依赖）
          pip install -r requirements.txt --no-cache-dir
          # 关键：重新安装 fs 和 fonttools，确保 pkg_resources 可用
          pip install --force-reinstall --no-cache-dir fs fonttools ufo2ft
          pip install cffsubr ttfautohint-py psautohint
          # 验证
          python -c "import pkg_resources; print('pkg_resources module found')"
          python -c "import fs; print('fs module works')"

      - name: Run tirobuild.py
        run: |
          python tools/tirobuild.py STIXbuild.yml

      - name: Package artifacts (classified by type)
        run: |
          mkdir -p artifacts tmp
          find output -type f \( -name "*.ttf" -o -name "*.otf" -o -name "*.woff" -o -name "*.woff2" \) | while read file; do
            if [[ "$file" =~ \.woff2?$ ]]; then
              category="web"
            elif [[ "$file" =~ /TTFVF/ ]]; then
              category="variable-ttf"
            elif [[ "$file" =~ /OTFVF/ ]]; then
              category="variable-otf"
            elif [[ "$file" =~ /TTF/ ]]; then
              category="static-ttf"
            elif [[ "$file" =~ /OTF/ ]]; then
              category="static-otf"
            else
              category="other"
            fi
            mkdir -p "tmp/$category"
            cp "$file" "tmp/$category/"
          done

          for cat in static-ttf static-otf variable-ttf variable-otf web other; do
            if [ -d "tmp/$cat" ] && [ -n "$(ls -A tmp/$cat)" ]; then
              (cd tmp && zip -r "../artifacts/stix-two-${cat}.zip" "$cat")
            fi
          done
          rm -rf tmp

      - name: Upload static TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-ttf
          path: artifacts/stix-two-static-ttf.zip
          if-no-files-found: ignore

      - name: Upload static OTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-otf
          path: artifacts/stix-two-static-otf.zip
          if-no-files-found: ignore

      - name: Upload variable TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-ttf
          path: artifacts/stix-two-variable-ttf.zip
          if-no-files-found: ignore

      - name: Upload variable OTF (CFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-otf
          path: artifacts/stix-two-variable-otf.zip
          if-no-files-found: ignore

      - name: Upload web fonts (WOFF/WOFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-web-fonts
          path: artifacts/stix-two-web.zip
          if-no-files-found: ignore

      - name: Upload other (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-other
          path: artifacts/stix-two-other.zip
          if-no-files-found: ignore