name: Build STIX Two Fonts (tirobuild – final fix)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget \
            ttfautohint

      - name: Install Python packages (including setuptools)
        run: |
          # 升级 pip 和 wheel
          pip install --upgrade pip wheel

          # 安装项目依赖（requirements.txt 包含了所有必要的包，但缺少 setuptools）
          pip install -r requirements.txt

          # 关键步骤：显式安装 setuptools (提供 pkg_resources)
          pip install setuptools

          # 强制重装 fs，确保其命名空间声明能找到刚安装的 pkg_resources
          pip install --force-reinstall --no-deps fs

          # 验证环境（可选）
          python -c "import pkg_resources; print('pkg_resources OK')"
          python -c "import fs; print('fs OK')"
          python -c "import ufo2ft; print('ufo2ft OK')"

      - name: Build fonts with tirobuild.py
        run: |
          python tools/tirobuild.py STIXbuild.yml

      - name: Package artifacts by category
        run: |
          mkdir -p artifacts tmp
          find output -type f \( -name "*.ttf" -o -name "*.otf" -o -name "*.woff" -o -name "*.woff2" \) | while read file; do
            if [[ "$file" =~ \.woff2?$ ]]; then
              category="web"
            elif [[ "$file" =~ /TTFVF/ ]]; then
              category="variable-ttf"
            elif [[ "$file" =~ /OTFVF/ ]]; then
              category="variable-otf"
            elif [[ "$file" =~ /TTF/ ]]; then
              category="static-ttf"
            elif [[ "$file" =~ /OTF/ ]]; then
              category="static-otf"
            else
              category="other"
            fi
            mkdir -p "tmp/$category"
            cp "$file" "tmp/$category/"
          done

          for cat in static-ttf static-otf variable-ttf variable-otf web other; do
            if [ -d "tmp/$cat" ] && [ -n "$(ls -A tmp/$cat)" ]; then
              (cd tmp && zip -r "../artifacts/stix-two-${cat}.zip" "$cat")
            fi
          done
          rm -rf tmp

      - name: Upload static TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-ttf
          path: artifacts/stix-two-static-ttf.zip
          if-no-files-found: ignore

      - name: Upload static OTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-otf
          path: artifacts/stix-two-static-otf.zip
          if-no-files-found: ignore

      - name: Upload variable TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-ttf
          path: artifacts/stix-two-variable-ttf.zip
          if-no-files-found: ignore

      - name: Upload variable OTF (CFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-otf
          path: artifacts/stix-two-variable-otf.zip
          if-no-files-found: ignore

      - name: Upload web fonts (WOFF/WOFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-web-fonts
          path: artifacts/stix-two-web.zip
          if-no-files-found: ignore

      - name: Upload other (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-other
          path: artifacts/stix-two-other.zip
          if-no-files-found: ignore