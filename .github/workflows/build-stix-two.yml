name: Build STIX Two Fonts (tirobuild – final)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ttfautohint

      - name: Install Python dependencies and fix setuptools
        run: |
          # 升级基础工具
          pip install --upgrade pip wheel

          # 安装项目所需的所有依赖（包括 fs, fonttools 等）
          pip install -r requirements.txt

          # 彻底移除并重新安装 setuptools（解决 pkg_resources 缺失问题）
          pip uninstall -y setuptools || true
          pip install --no-cache-dir setuptools==70.0.0

          # 验证 pkg_resources 是否可用
          python -c "import pkg_resources; print('pkg_resources module loaded successfully')"

          # 强制重装 fs，确保它使用正确的命名空间
          pip install --force-reinstall --no-deps fs

          # 验证其他关键模块
          python -c "import fs; print('fs module works')"
          python -c "import ufo2ft; print('ufo2ft module works')"

      - name: Build fonts with tirobuild.py
        run: |
          python tools/tirobuild.py STIXbuild.yml

      - name: Package artifacts by category
        run: |
          mkdir -p artifacts tmp
          find output -type f \( -name "*.ttf" -o -name "*.otf" -o -name "*.woff" -o -name "*.woff2" \) | while read file; do
            if [[ "$file" =~ \.woff2?$ ]]; then
              category="web"
            elif [[ "$file" =~ /TTFVF/ ]]; then
              category="variable-ttf"
            elif [[ "$file" =~ /OTFVF/ ]]; then
              category="variable-otf"
            elif [[ "$file" =~ /TTF/ ]]; then
              category="static-ttf"
            elif [[ "$file" =~ /OTF/ ]]; then
              category="static-otf"
            else
              category="other"
            fi
            mkdir -p "tmp/$category"
            cp "$file" "tmp/$category/"
          done

          for cat in static-ttf static-otf variable-ttf variable-otf web other; do
            if [ -d "tmp/$cat" ] && [ -n "$(ls -A tmp/$cat)" ]; then
              (cd tmp && zip -r "../artifacts/stix-two-${cat}.zip" "$cat")
            fi
          done
          rm -rf tmp

      - name: Upload static TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-ttf
          path: artifacts/stix-two-static-ttf.zip
          if-no-files-found: ignore

      - name: Upload static OTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-static-otf
          path: artifacts/stix-two-static-otf.zip
          if-no-files-found: ignore

      - name: Upload variable TTF
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-ttf
          path: artifacts/stix-two-variable-ttf.zip
          if-no-files-found: ignore

      - name: Upload variable OTF (CFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-variable-otf
          path: artifacts/stix-two-variable-otf.zip
          if-no-files-found: ignore

      - name: Upload web fonts (WOFF/WOFF2)
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-web-fonts
          path: artifacts/stix-two-web.zip
          if-no-files-found: ignore

      - name: Upload other (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stix-two-other
          path: artifacts/stix-two-other.zip
          if-no-files-found: ignore